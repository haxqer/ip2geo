name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# A new push to a PR supersedes the previous run; runs on main are never
# cancelled so every commit on main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never let the go command download a newer toolchain. Without this, the
  # 1.25.x matrix entry would silently switch toolchains if a dependency ever
  # raised the go directive, and stop proving that go.mod's `go 1.25.0` minimum
  # still builds.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1.25.x is the minimum declared in go.mod; stable is the latest release.
        go: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true # module + build cache, keyed on every module's go.sum
          cache-dependency-path: "**/go.sum"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files; run 'gofmt -w .'"
            echo "$unformatted"
            exit 1
          fi

      # Every module: the root (reader, csvdb, builder core), mmdb,
      # cmd/ip2geo, scripts/sizetable and bench. The nested ones build
      # against this checkout through replace directives (docs/RELEASING.md).
      - name: go mod tidy
        run: scripts/modules.sh run go mod tidy -diff

      # The root module is what `go get github.com/haxqer/ip2geo` adds to a
      # user's build: it must not require maxminddb (or anything else that
      # pulls it in). mmdb and cmd/ip2geo are modules of their own for this.
      - name: root module does not require maxminddb
        run: |
          graph="$(go mod graph)"
          echo "$graph"
          if grep -q maxminddb <<<"$graph"; then
            echo "::error file=go.mod::the root module's graph includes maxminddb"
            exit 1
          fi

      - name: go vet
        run: scripts/modules.sh run go vet ./...

      # bench/ included: it has no tests, so this is what keeps it building.
      - name: go build
        run: scripts/modules.sh run go build ./...

      # The mmdb integration tests skip here (IP2GEO_TEST_MMDB unset); they run
      # in the integration job below without -race.
      - name: go test -race
        run: scripts/modules.sh run go test -race ./...

      # 32-bit build of the hermetic reader tests: catches size arithmetic that
      # overflows int on 386. -race is not supported on 386.
      - name: go test (GOARCH=386, root package)
        if: matrix.go == 'stable'
        env:
          GOARCH: "386"
        run: go test ./

  # The hermetic reader tests on the other two release platforms: Open
  # memory-maps through mmap_windows.go there and through the Unix path with
  # Darwin's mmap on macOS. The root package only; the CLI and mmdb tests do
  # not depend on the platform.
  test-os:
    name: test (${{ matrix.os }}, Go stable)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: go test (root package)
        run: go test ./

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # Configuration lives in .golangci.yml (v2 format); golangci-lint finds
      # it from every module's directory. goinstall builds the linter through
      # the Go module proxy: the release binary comes from
      # github.com/.../releases/download, which has failed CI with 504s. The
      # action only installs it: one golangci-lint run covers one module, so
      # the run step goes through every module.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          install-only: true

      - name: golangci-lint config verify
        run: golangci-lint config verify

      - name: golangci-lint run
        run: scripts/modules.sh run golangci-lint run ./...

  vuln:
    name: vuln (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every module; scripts/modules.sh list prints the same set.
        module: [".", mmdb, cmd/ip2geo, scripts/sizetable, bench]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scans with the latest stable Go on purpose: an end-of-life 1.25.x patch
      # release would keep reporting standard-library vulnerabilities that only
      # a newer toolchain fixes, turning this job permanently red.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false # already checked out above, without persisted credentials
          go-version-input: stable
          cache-dependency-path: "**/go.sum"
          work-dir: ${{ matrix.module }}
          go-package: ./...

  # mmdb vX.Y.Z requires the root module vX.Y.Z or newer and imports its
  # internal/build package, which has no compatibility promise of its own; a
  # user can upgrade github.com/haxqer/ip2geo and keep an older mmdb. So the
  # newest released mmdb must still build, tests included, against this
  # root. Skipped until the first mmdb/v* tag exists.
  mmdb-compat:
    name: released mmdb builds against this root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build the newest mmdb/v* against this checkout's root module
        run: |
          tag="$(git tag --list 'mmdb/v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::notice::no mmdb/v* tag yet; skipping"
            exit 0
          fi
          echo "Building ${tag} against this root"
          git worktree add --detach "${RUNNER_TEMP}/released" "$tag"
          cd "${RUNNER_TEMP}/released/mmdb"
          go mod edit -replace "github.com/haxqer/ip2geo=${GITHUB_WORKSPACE}"
          go build ./...
          go vet ./...

  # Runs the mmdb and CLI integration tests against DB-IP IP-to-City Lite and
  # IP-to-ASN Lite (CC BY 4.0). The databases are only used as test input:
  # nothing built here is uploaded or published, so the attribution
  # requirement does not come into play. The monthly data.yml workflow is the
  # only place that publishes derived files.
  integration:
    name: integration (DB-IP Lite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: "**/go.sum"

      # DB-IP publishes the new month early in the month; until then the
      # current month's files are a 404, so fall back to the previous month.
      # City and ASN must come from the same month, so both are probed.
      - name: Pick DB-IP Lite month
        id: dbip
        run: |
          month="$(date -u +%Y-%m)"
          for edition in city asn; do
            url="https://download.db-ip.com/free/dbip-${edition}-lite-${month}.mmdb.gz"
            if ! curl -fsSIL --retry 2 -o /dev/null "$url"; then
              prev="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
              echo "::notice::${url} is not available yet; using ${prev}"
              month="$prev"
              break
            fi
          done
          {
            echo "month=${month}"
            echo "dir=${RUNNER_TEMP}/dbip"
            echo "gz=${RUNNER_TEMP}/dbip/dbip-city-lite-${month}.mmdb.gz"
            echo "asn-dir=${RUNNER_TEMP}/dbip-asn"
            echo "asn-gz=${RUNNER_TEMP}/dbip-asn/dbip-asn-lite-${month}.mmdb.gz"
          } >> "$GITHUB_OUTPUT"

      # restore/save are split so the download is cached even when the tests
      # fail (a plain actions/cache only saves after a successful job).
      - name: Restore DB-IP Lite from cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dbip.outputs.dir }}
          key: dbip-city-lite-${{ steps.dbip.outputs.month }}

      - name: Download DB-IP Lite
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MONTH: ${{ steps.dbip.outputs.month }}
          DIR: ${{ steps.dbip.outputs.dir }}
          GZ: ${{ steps.dbip.outputs.gz }}
        run: |
          mkdir -p "$DIR"
          curl -fsSL --retry 3 --retry-delay 5 -o "$GZ" \
            "https://download.db-ip.com/free/dbip-city-lite-${MONTH}.mmdb.gz"
          gzip -t "$GZ"
          ls -l "$GZ"

      - name: Save DB-IP Lite to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dbip.outputs.dir }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # ASN Lite has its own cache entry rather than sharing the City one:
      # bench.yml saves the City entry with the same key and without ASN, so
      # a shared entry could be restored without the ASN file in it.
      - name: Restore DB-IP ASN Lite from cache
        id: cache-asn
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dbip.outputs.asn-dir }}
          key: dbip-asn-lite-${{ steps.dbip.outputs.month }}

      - name: Download DB-IP ASN Lite
        if: steps.cache-asn.outputs.cache-hit != 'true'
        env:
          MONTH: ${{ steps.dbip.outputs.month }}
          DIR: ${{ steps.dbip.outputs.asn-dir }}
          GZ: ${{ steps.dbip.outputs.asn-gz }}
        run: |
          mkdir -p "$DIR"
          curl -fsSL --retry 3 --retry-delay 5 -o "$GZ" \
            "https://download.db-ip.com/free/dbip-asn-lite-${MONTH}.mmdb.gz"
          gzip -t "$GZ"
          ls -l "$GZ"

      - name: Save DB-IP ASN Lite to cache
        if: steps.cache-asn.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dbip.outputs.asn-dir }}
          key: ${{ steps.cache-asn.outputs.cache-primary-key }}

      - name: Decompress
        env:
          GZ: ${{ steps.dbip.outputs.gz }}
          ASN_GZ: ${{ steps.dbip.outputs.asn-gz }}
        run: |
          gunzip -c "$GZ" > "${RUNNER_TEMP}/dbip-city-lite.mmdb"
          gunzip -c "$ASN_GZ" > "${RUNNER_TEMP}/dbip-asn-lite.mmdb"

      # No -race: the race detector inflates the ~26 s City build so much that
      # the two tests took 743 s, past go test's 600 s default timeout. The
      # race detector stays on the hermetic tests in the test job. -count=1
      # keeps a cached result from standing in for a real run.
      # TestExtMatchesSource checks every field set in three languages and
      # TestASNMatchesSource the ASN profile, both against maxminddb.
      - name: Integration tests
        working-directory: mmdb
        env:
          IP2GEO_TEST_MMDB: ${{ runner.temp }}/dbip-city-lite.mmdb
          IP2GEO_TEST_ASN_MMDB: ${{ runner.temp }}/dbip-asn-lite.mmdb
        run: |
          test -s "$IP2GEO_TEST_MMDB"
          test -s "$IP2GEO_TEST_ASN_MMDB"
          go test -v -count=1 -timeout 30m \
            -run 'TestBuildMatchesSource|TestOpenInMemory|TestRegisteredCountryOnly|TestExtMatchesSource|TestASNMatchesSource' .

      # build, info and lookup through the CLI on both sources: -fields all
      # with two languages on City, -profile asn on ASN. No -race, as above.
      - name: CLI integration test
        working-directory: cmd/ip2geo
        env:
          IP2GEO_TEST_MMDB: ${{ runner.temp }}/dbip-city-lite.mmdb
          IP2GEO_TEST_ASN_MMDB: ${{ runner.temp }}/dbip-asn-lite.mmdb
        run: go test -v -count=1 -timeout 15m -run 'TestBuildCommand' .

      # Lookup ns/op and allocs/op per profile for IPv4 and IPv6 on the same
      # database. No -race. Shared runners are noisy, so the numbers are for
      # reading, not a gate; only a failure to build or run fails the step.
      - name: Lookup benchmark
        working-directory: mmdb
        env:
          IP2GEO_TEST_MMDB: ${{ runner.temp }}/dbip-city-lite.mmdb
        run: go test -run '^$' -bench BenchmarkLookup -benchtime=2s .

  # Rebuilds the README's size table (between <!-- size-table:begin --> and
  # <!-- size-table:end -->) from the DB-IP Lite month pinned in
  # scripts/size-table.month and fails, printing a diff, when README.md
  # differs: a builder change that moves any size or count must regenerate it
  # (scripts/size-table.sh update). DB-IP serves only the current month, so
  # the sources come from our own release data-<month>, where data.yml
  # attaches them; a release made before that has none, and the check is then
  # skipped with a notice rather than failed. The sources are test input only:
  # nothing built here is uploaded or published.
  size-table:
    name: README size table
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: "**/go.sum"

      # fetch downloads the three sources and checks them against the
      # release's checksums.txt. It exits 0 (sources ready), 1 (the release
      # has no source assets -> skip) or 2 (any error -> fail). When the
      # release download URLs fail it falls back to the API through gh.
      - name: Fetch the pinned DB-IP Lite sources
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }} # only for the gh fallback when the download URLs fail
        run: |
          month="$(scripts/size-table.sh month)"
          rc=0
          scripts/size-table.sh fetch "$RUNNER_TEMP/size-table" || rc=$?
          case "$rc" in
            0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "found=false" >> "$GITHUB_OUTPUT"
               echo "::notice::release data-${month} has no DB-IP Lite source assets; the README size table check is skipped"
               echo "Release \`data-${month}\` has no DB-IP Lite source assets: the README size table check was skipped." >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit "$rc" ;;
          esac

      # 16 builds through go run, so without the race detector, which would
      # slow the City builds past any useful timeout (see integration).
      - name: Check the README size table
        if: steps.fetch.outputs.found == 'true'
        run: scripts/size-table.sh check "$RUNNER_TEMP/size-table"
