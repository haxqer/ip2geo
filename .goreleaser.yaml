# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser v2 configuration. Runs from .github/workflows/release.yml on v* tags.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: ip2geo

before:
  hooks:
    - go mod download

builds:
  - id: ip2geo
    main: ./cmd/ip2geo
    binary: ip2geo
    env:
      - CGO_ENABLED=0 # static binaries, no libc dependency
    flags:
      - -trimpath # no local paths in the binary; reproducible builds
    ldflags:
      - -s -w # strip symbol table and DWARF
    # Stamp files with the commit time instead of "now" so rebuilding the
    # same tag gives byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Six pairs: {linux,darwin,windows} x {amd64,arm64}.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: ip2geo
    ids: [ip2geo]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Monthly data releases are tagged data-YYYY-MM on main. Exclude them so the
# previous-tag lookup (git describe --exclude, which takes globs) only sees v*
# tags and the changelog spans release to release.
git:
  ignore_tags:
    - "data-*"

changelog:
  use: git # newest first, as git log lists them
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  # Tags like v0.2.0-rc.1 become GitHub pre-releases.
  prerelease: auto
  footer: |
    The curated list of changes is in [CHANGELOG.md](https://github.com/haxqer/ip2geo/blob/{{ .Tag }}/CHANGELOG.md).

snapshot:
  version_template: "{{ incpatch .Version }}-next"
