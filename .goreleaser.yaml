# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser v2 configuration. Runs from .github/workflows/release.yml on v* tags.
# Local dry run: goreleaser release --snapshot --clean
#
# The CLI is the module github.com/haxqer/ip2geo/cmd/ip2geo. On the commit
# tagged vX.Y.Z its go.mod requires the root and mmdb modules at vX.Y.Z and
# replaces both with this tree (docs/RELEASING.md; the release workflow runs
# scripts/modules.sh check), so the binaries are built from the tagged
# sources, not from whatever versions are published.
version: 2

project_name: ip2geo

before:
  hooks:
    - go -C cmd/ip2geo mod download

builds:
  - id: ip2geo
    dir: cmd/ip2geo # the module's directory; go build runs there
    main: .
    binary: ip2geo
    env:
      - CGO_ENABLED=0 # static binaries, no libc dependency
    flags:
      - -trimpath # no local paths in the binary; reproducible builds
    ldflags:
      - -s -w # strip symbol table and DWARF
      # A module replaced by a directory has no version in the build
      # information, so name the release for the builder string that built
      # files record ("ip2geo/vX.Y.Z", see internal/build.BuilderName).
      - -X github.com/haxqer/ip2geo/internal/build.version=v{{ .Version }}
    # Stamp files with the commit time instead of "now" so rebuilding the
    # same tag gives byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Six pairs: {linux,darwin,windows} x {amd64,arm64}.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: ip2geo
    ids: [ip2geo]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Monthly data releases are tagged data-YYYY-MM on main, and the nested
# modules mmdb/vX.Y.Z and cmd/ip2geo/vX.Y.Z. Exclude them so the previous-tag
# lookup (git describe --exclude, which takes globs) only sees v* tags and
# the changelog spans release to release.
git:
  ignore_tags:
    - "data-*"
    - "mmdb/*"
    - "cmd/*"

changelog:
  use: git # newest first, as git log lists them
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  # Tags like v0.2.0-rc.1 become GitHub pre-releases.
  prerelease: auto
  footer: |
    The curated list of changes is in [CHANGELOG.md](https://github.com/haxqer/ip2geo/blob/{{ .Tag }}/CHANGELOG.md).

snapshot:
  version_template: "{{ incpatch .Version }}-next"
